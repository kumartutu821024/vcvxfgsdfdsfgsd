<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Debug - Mission Topper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #64b5f6;
            margin-bottom: 20px;
            border-bottom: 2px solid #64b5f6;
            padding-bottom: 10px;
        }

        h2 {
            color: #81c784;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        button {
            background: #42a5f5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #2196f3;
        }

        button:active {
            background: #1976d2;
        }

        .test-section {
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .output {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            color: #0f0;
            font-size: 12px;
        }

        .success { color: #4caf50; font-weight: bold; }
        .error { color: #f44336; font-weight: bold; }
        .info { color: #2196f3; font-weight: bold; }
        .warning { color: #ff9800; font-weight: bold; }

        .status-ok { color: #4caf50; }
        .status-error { color: #f44336; }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #90caf9;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .logs {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .log-time {
            color: #666;
            font-size: 11px;
        }

        code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            color: #64b5f6;
        }

        .clear-btn {
            background: #f44336;
        }

        .clear-btn:hover {
            background: #d32f2f;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #2d2d2d;
            border-left: 4px solid #42a5f5;
            padding: 10px;
        }

        .stat-label {
            color: #90caf9;
            font-size: 11px;
        }

        .stat-value {
            color: #4caf50;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 API Debug Console - Mission Topper</h1>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Requests Made</div>
                <div class="stat-value" id="stat-requests">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Successful</div>
                <div class="stat-value" id="stat-success">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Failed</div>
                <div class="stat-value" id="stat-failed">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Avg Response</div>
                <div class="stat-value" id="stat-avg">0ms</div>
            </div>
        </div>

        <div class="grid">
            <div>
                <div class="test-section">
                    <h2>Test API</h2>
                    <button onclick="testDebug()">🧪 Test Debug Endpoint</button>
                    <button onclick="testBatches()">📚 Test Batches</button>
                    <button onclick="testSubjects()">📖 Test Subjects</button>
                    <button onclick="testLectures()">🎬 Test Lectures</button>
                    <div class="output" id="output-test"></div>
                </div>
            </div>

            <div>
                <div class="test-section">
                    <h2>Raw Response</h2>
                    <button onclick="clearOutput('output-raw')">Clear</button>
                    <div class="output" id="output-raw">Waiting for requests...</div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2>Configuration</h2>
            <div class="input-group">
                <label>API Base URL</label>
                <input type="text" id="api-url" value="./api.php" />
            </div>
            <div class="input-group">
                <label>Batch ID (for subjects test)</label>
                <input type="text" id="batch-id" value="kota_neet_ug_2026_master_pro_1" />
            </div>
            <div class="input-group">
                <label>Subject UID (for lectures test)</label>
                <input type="text" id="subject-id" value="W79Z40CU" />
            </div>
        </div>

        <div class="test-section">
            <h2>Console Logs</h2>
            <button onclick="clearLogs()">Clear Logs</button>
            <div class="logs" id="logs">Logs appear here...</div>
        </div>
    </div>

    <script>
        let stats = {
            requests: 0,
            success: 0,
            failed: 0,
            times: []
        };

        function log(type, message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            const logs = document.getElementById('logs');

            let color = '#666';
            let icon = '•';

            switch(type) {
                case 'success': color = '#4caf50'; icon = '✓'; break;
                case 'error': color = '#f44336'; icon = '✕'; break;
                case 'info': color = '#2196f3'; icon = 'ℹ'; break;
                case 'warn': color = '#ff9800'; icon = '⚠'; break;
            }

            let entry = `<div class="log-entry"><span class="log-time">${timestamp}</span> <span style="color:${color}">${icon} ${message}</span>`;
            if (data) {
                entry += `<br/><code>${JSON.stringify(data).substring(0, 100)}...</code>`;
            }
            entry += '</div>';

            logs.innerHTML += entry;
            logs.scrollTop = logs.scrollHeight;
        }

        async function makeRequest(endpoint, label) {
            const startTime = Date.now();
            const apiUrl = document.getElementById('api-url').value;
            const url = apiUrl + '/' + endpoint;

            stats.requests++;
            log('info', `Requesting: ${label}`, { url });

            try {
                const response = await fetch(url);
                const data = await response.json();
                const duration = Date.now() - startTime;

                stats.times.push(duration);

                if (response.ok && data.success) {
                    stats.success++;
                    log('success', `${label} - OK (${duration}ms)`, data);
                    showOutput('output-test', `<span class="success">✓ SUCCESS</span> (${duration}ms)\n\n<pre>${JSON.stringify(data, null, 2)}</pre>`);
                    showOutput('output-raw', `<pre>${JSON.stringify(data, null, 2)}</pre>`);
                } else {
                    stats.failed++;
                    log('error', `${label} - FAILED`, data);
                    showOutput('output-test', `<span class="error">✕ FAILED</span>\n\n<pre>${JSON.stringify(data, null, 2)}</pre>`);
                }
            } catch (e) {
                stats.failed++;
                const duration = Date.now() - startTime;
                log('error', `${label} - ERROR (${duration}ms)`, e.message);
                showOutput('output-test', `<span class="error">✕ ERROR</span>\n${e.message}`);
            }

            updateStats();
        }

        function updateStats() {
            document.getElementById('stat-requests').textContent = stats.requests;
            document.getElementById('stat-success').textContent = stats.success;
            document.getElementById('stat-failed').textContent = stats.failed;

            if (stats.times.length > 0) {
                const avg = Math.round(stats.times.reduce((a,b) => a+b) / stats.times.length);
                document.getElementById('stat-avg').textContent = avg + 'ms';
            }
        }

        function showOutput(id, content) {
            document.getElementById(id).innerHTML = content;
        }

        function clearOutput(id) {
            document.getElementById(id).innerHTML = '';
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        function testDebug() {
            log('info', 'Testing debug endpoint...');
            makeRequest('debug', 'Debug');
        }

        function testBatches() {
            log('info', 'Testing batches endpoint...');
            makeRequest('batches', 'Batches');
        }

        function testSubjects() {
            const batchId = document.getElementById('batch-id').value;
            log('info', `Testing subjects endpoint for: ${batchId}`);
            makeRequest(`batches/${encodeURIComponent(batchId)}`, 'Subjects');
        }

        function testLectures() {
            const subjectId = document.getElementById('subject-id').value;
            log('info', `Testing lectures endpoint for: ${subjectId}`);
            makeRequest(`subjects/${encodeURIComponent(subjectId)}`, 'Lectures');
        }

        // Initial log
        log('info', 'API Debug Console Ready', { version: '1.0', timestamp: new Date().toISOString() });
    </script>
</body>
</html>
